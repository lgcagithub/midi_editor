<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merengue — MIDI 编辑器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&family=JetBrains+Mono:wght@400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2/src/duotone/style.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --background:#1A1819;--bg:var(--background);
  --surface1:#242223;--surface2:#2E2927;--surface3:#423B38;
  --border:#2E2927;--border-visible:#423B38;
  --text1:#FAF9F8;--text2:#A89D96;--text3:#7A706A;--text4:#5C5450;
  --accent:#FF6E82;--accent-subtle:#3D0D17;
  --success:#4BC0A0;--warning:#F4A742;--error:#E5484D;
  --success-bg:#0F2E28;--warning-bg:#2E2412;--error-bg:#2E1515;
  --font-display:"Fredoka","Segoe UI","Noto Sans SC",sans-serif;
  --font-body:"Nunito Sans","Segoe UI","Noto Sans SC",sans-serif;
  --font-mono:"JetBrains Mono","Consolas","Courier New",monospace;
  --radius-element:4px;--radius-control:8px;--radius-component:12px;--radius-container:16px;--radius-pill:999px;
  --ease-micro:cubic-bezier(0.34,1.56,0.64,1);
  --duration-micro:150ms;--duration-standard:250ms;
  --shadow-1:0 1px 2px rgba(0,0,0,0.20),0 1px 4px rgba(0,0,0,0.30);
  --shadow-2:0 2px 8px rgba(0,0,0,0.30),0 4px 16px rgba(0,0,0,0.20);
  --note-coral:#FF5C72;--note-tangerine:#FFB347;--note-sky:#7EC8E3;
  --note-lavender:#C3A6F4;--note-mint:#4BC0A0;--note-peach:#FF8A80;
  --note-lemon:#FFE566;--note-lilac:#D4A5F6;
  --space-sm:8px;--space-md:16px;--space-lg:24px;
}
[data-theme="light"]{
  --background:#FAF9F8;--bg:var(--background);
  --surface1:#F5F2F0;--surface2:#E8E3DF;--surface3:#D4CDC7;
  --border:#E8E3DF;--border-visible:#D4CDC7;
  --text1:#242223;--text2:#5C5450;--text3:#7A706A;--text4:#A89D96;
  --accent:#FF5C72;--accent-subtle:#FFF0F2;
  --success-bg:#F0FDF6;--warning-bg:#FFFBF0;--error-bg:#FEF2F2;
  --shadow-1:0 1px 2px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.06);
  --shadow-2:0 2px 8px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
}
body{
  font-family:var(--font-body);font-size:13px;line-height:1.5;
  color:var(--text1);background:#0D0D0E;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
}

/* Browser frame */
.app-frame{
  width:100%;max-width:1200px;height:90vh;min-height:700px;
  border-radius:10px;overflow:hidden;
  background:var(--background);
  border:1px solid #333;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  display:flex;flex-direction:column;
}
.app-titlebar{
  height:38px;background:#1E1D1E;display:flex;align-items:center;padding:0 16px;gap:8px;
  border-bottom:1px solid #333;flex-shrink:0;
}
.app-dot{width:10px;height:10px;border-radius:50%}
.app-dot--r{background:#E5484D}.app-dot--y{background:#F4A742}.app-dot--g{background:#4BC0A0}
.app-url{
  flex:1;text-align:center;font-size:11px;color:#7A706A;font-family:var(--font-body);
  background:#141314;border-radius:5px;padding:4px 12px;margin:0 12px;
}
.app-body{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Toolbar */
.toolbar{
  height:44px;background:var(--surface1);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:6px;flex-shrink:0;
}
.tool-group{display:flex;gap:2px;padding:0 8px;border-right:1px solid var(--border)}
.tool-group:last-child{border-right:none}
.tool-btn{
  width:32px;height:32px;border-radius:var(--radius-control);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  background:transparent;color:var(--text3);
  transition:all var(--duration-micro) var(--ease-micro);
}
.tool-btn:hover{background:var(--surface2);color:var(--text1)}
.tool-btn.is-active{background:var(--accent-subtle);color:var(--accent)}
.tool-spacer{flex:1}

/* Main content area */
.main-content{flex:1;display:flex;overflow:hidden}

/* Piano Keyboard (left) */
.keyboard{
  width:60px;background:var(--surface1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;position:relative;
}
.white-key{
  height:14px;background:linear-gradient(180deg,#3C3835,#2E2927);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:flex-end;padding-right:4px;
  font-size:7px;color:var(--text4);cursor:pointer;transition:background var(--duration-micro) var(--ease-micro);
}
.white-key:hover{background:linear-gradient(180deg,#4A4440,#3C3835)}
.white-key.is-c{border-bottom:1px solid var(--border-visible)}
.black-key{
  position:absolute;right:0;width:36px;height:9px;
  background:linear-gradient(180deg,#1A1819,#141212);
  border-radius:0 4px 4px 0;z-index:2;cursor:pointer;
  transition:background var(--duration-micro) var(--ease-micro);
}
.black-key:hover{background:linear-gradient(180deg,#2E2927,#1A1819)}

/* Piano Roll canvas area */
.piano-roll{flex:1;position:relative;overflow:hidden;background:var(--background)}
.pr-grid{position:absolute;inset:0}
.pr-row{height:14px;border-bottom:1px solid rgba(46,41,39,0.5)}
.pr-row:nth-child(odd){background:rgba(36,34,35,0.3)}
.pr-row.is-c{border-bottom:1px solid rgba(66,59,56,0.6)}
.pr-bar-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(66,59,56,0.5)}
.pr-bar-line.beat{background:rgba(66,59,56,0.3)}

/* Note blocks on the piano roll */
.note-block{
  position:absolute;height:12px;border-radius:3px;
  transition:filter var(--duration-micro) var(--ease-micro);
  border-top:1px solid rgba(255,255,255,0.2);
  border-bottom:1px solid rgba(0,0,0,0.2);
  cursor:pointer;
}
.note-block:hover{filter:brightness(1.15)}
.note-block.is-selected{box-shadow:0 0 0 2px var(--accent),inset 0 0 0 1px rgba(255,255,255,0.3)}

/* Playback cursor */
.play-cursor{
  position:absolute;top:0;bottom:0;width:1px;background:var(--accent);
  z-index:10;box-shadow:0 0 8px rgba(255,110,130,0.4);
}
.play-cursor::after{
  content:"";position:absolute;top:0;left:-3px;
  width:0;height:0;
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:6px solid var(--accent);
}

/* Track list sidebar (right) */
.track-sidebar{
  width:200px;background:var(--surface1);border-left:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
}
.track-sidebar-header{
  padding:10px 14px;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.05em;color:var(--text3);border-bottom:1px solid var(--border);
}
.track-item{
  padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background var(--duration-micro) var(--ease-micro);
  display:flex;align-items:center;gap:10px;
}
.track-item:hover{background:var(--surface2)}
.track-item.is-selected{background:var(--accent-subtle);border-left:2px solid var(--accent);padding-left:12px}
.track-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.track-info{flex:1;min-width:0}
.track-name{font-size:12px;font-weight:600;color:var(--text1);margin-bottom:1px}
.track-meta{font-family:var(--font-mono);font-size:10px;color:var(--text3)}
.track-actions{color:var(--text3);font-size:14px}

/* Transport bar (bottom) */
.transport-bar{
  height:52px;background:var(--surface1);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:16px;flex-shrink:0;
}
.transport-btns{display:flex;gap:4px;align-items:center}
.tp-btn{
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:transparent;color:var(--text2);
  transition:all var(--duration-micro) var(--ease-micro);
}
.tp-btn:hover{background:var(--surface2);color:var(--text1);transform:scale(1.05)}
.tp-btn:active{transform:scale(0.95)}
.tp-btn.play{
  background:var(--accent);color:#fff;width:44px;height:44px;font-size:22px;
}
.tp-btn.play:hover{background:#E54D62}
.transport-divider{width:1px;height:28px;background:var(--border)}
.transport-time{
  font-family:var(--font-mono);font-size:16px;color:var(--text1);
  display:flex;align-items:baseline;gap:2px;
}
.transport-time .cs{font-size:11px;color:var(--text3)}
.transport-bpm{
  display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:13px;color:var(--text2);
  background:var(--surface2);padding:4px 10px;border-radius:var(--radius-control);
}
.transport-bpm span{color:var(--accent);font-weight:600}
.transport-spacer{flex:1}
.transport-label{font-size:10px;color:var(--text3)}

/* Grid selector */
.grid-selector{
  display:flex;gap:2px;background:var(--surface2);padding:2px;border-radius:var(--radius-control);
}
.grid-opt{
  padding:4px 10px;border-radius:var(--radius-element);border:none;cursor:pointer;
  font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--text3);
  background:transparent;transition:all var(--duration-micro) var(--ease-micro);
}
.grid-opt:hover{color:var(--text1)}
.grid-opt.is-active{background:var(--accent-subtle);color:var(--accent)}

/* Floating bar */
.floating-bar{
  position:fixed;bottom:24px;right:24px;z-index:100;
  display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;
  background:var(--surface1);border:1.5px solid var(--border);
  box-shadow:0px 8px 32px rgba(0,0,0,0.12);
}
.mode-btn{
  height:32px;border-radius:999px;border:none;background:transparent;cursor:pointer;
  display:flex;align-items:center;gap:6px;padding:0 14px;
  font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--text3);
  transition:all var(--duration-micro) var(--ease-micro);outline:none;
}
.mode-btn:hover{color:var(--text1)}
.mode-btn.active{background:var(--surface3);color:var(--text1)}
.mode-btn i{font-size:14px}

/* Pink cursor — mid-use signal */
.fake-cursor{
  position:absolute;width:18px;height:18px;pointer-events:none;z-index:20;
  background:var(--accent);border-radius:50%;opacity:0.85;
  box-shadow:0 0 12px rgba(255,110,130,0.5);
  transition:all 0.8s ease-in-out;
}
</style>
</head>
<body>

<div class="app-frame">
  <!-- Title bar -->
  <div class="app-titlebar">
    <div class="app-dot app-dot--r"></div>
    <div class="app-dot app-dot--y"></div>
    <div class="app-dot app-dot--g"></div>
    <div class="app-url">merengue.app/projects/summer_demo — Piano Roll</div>
  </div>

  <div class="app-body">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="tool-group">
        <button class="tool-btn is-active" title="Pointer (V)"><i class="ph-duotone ph-cursor"></i></button>
        <button class="tool-btn" title="Pencil (B)"><i class="ph-duotone ph-pencil"></i></button>
        <button class="tool-btn" title="Eraser (E)"><i class="ph-duotone ph-eraser"></i></button>
      </div>
      <div class="tool-group">
        <button class="tool-btn" title="Undo Ctrl+Z"><i class="ph-duotone ph-arrow-u-up-left"></i></button>
        <button class="tool-btn" title="Redo Ctrl+Y"><i class="ph-duotone ph-arrow-u-up-right"></i></button>
      </div>
      <div class="tool-spacer"></div>
      <div class="tool-group">
        <button class="tool-btn" title="Zoom In"><i class="ph-duotone ph-magnifying-glass-plus"></i></button>
        <button class="tool-btn" title="Zoom Out"><i class="ph-duotone ph-magnifying-glass-minus"></i></button>
      </div>
    </div>

    <!-- Main content -->
    <div class="main-content">
      <!-- Piano Keyboard -->
      <div class="keyboard">
        <!-- White keys with black key overlays (C4-B4 shown for demo) -->
        <div class="white-key is-c" style="position:relative"><span style="font-size:7px">B4</span></div>
        <div class="white-key" style="position:relative"><span style="font-size:7px">A#4</span><div class="black-key" style="top:3px"></div></div>
        <div class="white-key"><span style="font-size:7px">A4</span></div>
        <div class="white-key" style="position:relative"><span style="font-size:7px">G#4</span><div class="black-key" style="top:3px"></div></div>
        <div class="white-key"><span style="font-size:7px">G4</span></div>
        <div class="white-key" style="position:relative"><span style="font-size:7px">F#4</span><div class="black-key" style="top:3px"></div></div>
        <div class="white-key"><span style="font-size:7px">F4</span></div>
        <div class="white-key"><span style="font-size:7px">E4</span></div>
        <div class="white-key" style="position:relative"><span style="font-size:7px">D#4</span><div class="black-key" style="top:3px"></div></div>
        <div class="white-key"><span style="font-size:7px">D4</span></div>
        <div class="white-key" style="position:relative"><span style="font-size:7px">C#4</span><div class="black-key" style="top:3px"></div></div>
        <div class="white-key is-c"><span style="font-size:7px">C4</span></div>
        <div class="white-key"><span style="font-size:7px">B3</span></div>
        <div class="white-key" style="position:relative"><span style="font-size:7px">A#3</span><div class="black-key" style="top:3px"></div></div>
        <div class="white-key"><span style="font-size:7px">A3</span></div>
        <div class="white-key" style="position:relative"><span style="font-size:7px">G#3</span><div class="black-key" style="top:3px"></div></div>
        <div class="white-key"><span style="font-size:7px">G3</span></div>
        <div class="white-key" style="position:relative"><span style="font-size:7px">F#3</span><div class="black-key" style="top:3px"></div></div>
        <div class="white-key"><span style="font-size:7px">F3</span></div>
        <div class="white-key"><span style="font-size:7px">E3</span></div>
      </div>

      <!-- Piano Roll Canvas -->
      <div class="piano-roll" id="pianoRoll">
        <!-- Grid rows -->
        <div class="pr-grid">
          <div class="pr-row is-c"></div><div class="pr-row"></div><div class="pr-row"></div>
          <div class="pr-row"></div><div class="pr-row"></div><div class="pr-row"></div>
          <div class="pr-row"></div><div class="pr-row is-c"></div><div class="pr-row"></div>
          <div class="pr-row"></div><div class="pr-row"></div><div class="pr-row"></div>
          <div class="pr-row"></div><div class="pr-row is-c"></div><div class="pr-row"></div>
          <div class="pr-row"></div><div class="pr-row"></div><div class="pr-row"></div>
          <div class="pr-row"></div><div class="pr-row"></div><div class="pr-row"></div>
        </div>
        <!-- Bar lines -->
        <div class="pr-bar-line" style="left:120px"></div>
        <div class="pr-bar-line beat" style="left:150px"></div>
        <div class="pr-bar-line beat" style="left:180px"></div>
        <div class="pr-bar-line beat" style="left:210px"></div>
        <div class="pr-bar-line" style="left:240px"></div>
        <div class="pr-bar-line beat" style="left:270px"></div>
        <div class="pr-bar-line beat" style="left:300px"></div>
        <div class="pr-bar-line beat" style="left:330px"></div>
        <div class="pr-bar-line" style="left:360px"></div>
        <div class="pr-bar-line beat" style="left:390px"></div>
        <div class="pr-bar-line beat" style="left:420px"></div>

        <!-- Note blocks — Piano track (coral) -->
        <div class="note-block" style="top:28px;left:124px;width:56px;background:var(--note-coral)" title="C4 · vel 100 · dur 240"></div>
        <div class="note-block" style="top:42px;left:154px;width:26px;background:var(--note-coral);opacity:0.65" title="D4 · vel 64 · dur 120"></div>
        <div class="note-block" style="top:56px;left:184px;width:56px;background:var(--note-coral)" title="E4 · vel 100 · dur 240"></div>
        <div class="note-block" style="top:42px;left:214px;width:54px;background:var(--note-coral);opacity:0.8" title="D4 · vel 80 · dur 240"></div>
        <div class="note-block" style="top:70px;left:248px;width:112px;background:var(--note-coral)" title="F4 · vel 110 · dur 480"></div>
        <div class="note-block" style="top:28px;left:274px;width:56px;background:var(--note-coral)" title="C4 · vel 100 · dur 240"></div>
        <div class="note-block is-selected" style="top:14px;left:334px;width:56px;background:var(--note-peach)" title="B3 · vel 90 · dur 240 (selected)"></div>

        <!-- Note blocks — Strings track (sky blue) -->
        <div class="note-block" style="top:98px;left:124px;width:80px;background:var(--note-sky);opacity:0.7" title="A3 · vel 70 · dur 360"></div>
        <div class="note-block" style="top:112px;left:184px;width:56px;background:var(--note-sky);opacity:0.7" title="G3 · vel 72 · dur 240"></div>
        <div class="note-block" style="top:126px;left:244px;width:116px;background:var(--note-sky);opacity:0.7" title="F3 · vel 68 · dur 480"></div>

        <!-- Note blocks — Bass track (lavender) -->
        <div class="note-block" style="top:170px;left:124px;width:56px;background:var(--note-lavender);opacity:0.75" title="E3 · vel 85 · dur 240"></div>
        <div class="note-block" style="top:170px;left:214px;width:56px;background:var(--note-lavender);opacity:0.75" title="E3 · vel 80 · dur 240"></div>
        <div class="note-block" style="top:184px;left:274px;width:86px;background:var(--note-lavender);opacity:0.75" title="D3 · vel 82 · dur 360"></div>
        <div class="note-block" style="top:198px;left:364px;width:56px;background:var(--note-lavender);opacity:0.75" title="C3 · vel 78 · dur 240"></div>

        <!-- Playback cursor (mid-song) -->
        <div class="play-cursor" style="left:305px"></div>

        <!-- Fake pink cursor — mid-use signal -->
        <div class="fake-cursor" style="top:12px;left:346px" id="fakeCursor"></div>
      </div>

      <!-- Track List Sidebar -->
      <div class="track-sidebar">
        <div class="track-sidebar-header">音轨</div>
        <div class="track-item is-selected">
          <div class="track-dot" style="background:var(--note-coral)"></div>
          <div class="track-info">
            <div class="track-name">钢琴旋律</div>
            <div class="track-meta">312 notes · Ch.1</div>
          </div>
          <div class="track-actions"><i class="ph-duotone ph-dots-three-vertical"></i></div>
        </div>
        <div class="track-item">
          <div class="track-dot" style="background:var(--note-sky)"></div>
          <div class="track-info">
            <div class="track-name">弦乐和声</div>
            <div class="track-meta">205 notes · Ch.2</div>
          </div>
          <div class="track-actions"><i class="ph-duotone ph-dots-three-vertical"></i></div>
        </div>
        <div class="track-item">
          <div class="track-dot" style="background:var(--note-lavender)"></div>
          <div class="track-info">
            <div class="track-name">贝斯线</div>
            <div class="track-meta">178 notes · Ch.3</div>
          </div>
          <div class="track-actions"><i class="ph-duotone ph-dots-three-vertical"></i></div>
        </div>
        <div class="track-item" style="opacity:0.5">
          <div class="track-dot" style="background:var(--note-mint)"></div>
          <div class="track-info">
            <div class="track-name">打击乐</div>
            <div class="track-meta">152 notes · Ch.4</div>
          </div>
        </div>
        <div style="padding:12px">
          <button style="width:100%;padding:8px;border-radius:var(--radius-control);border:1px dashed var(--border-visible);background:transparent;color:var(--text3);cursor:pointer;font-family:var(--font-body);font-size:12px;transition:all var(--duration-micro) var(--ease-micro)">
            <i class="ph-duotone ph-plus"></i> 添加音轨
          </button>
        </div>
      </div>
    </div>

    <!-- Transport Bar -->
    <div class="transport-bar">
      <div class="transport-btns">
        <button class="tp-btn"><i class="ph-duotone ph-skip-back"></i></button>
        <button class="tp-btn play"><i class="ph-duotone ph-pause"></i></button>
        <button class="tp-btn"><i class="ph-duotone ph-skip-forward"></i></button>
        <button class="tp-btn"><i class="ph-duotone ph-stop"></i></button>
      </div>
      <div class="transport-divider"></div>
      <div class="transport-time">00:00<span class="cs">:42</span></div>
      <div class="transport-divider"></div>
      <div class="transport-bpm">BPM <span>120</span></div>
      <div class="transport-spacer"></div>
      <div class="transport-label" style="margin-right:6px">Snap:</div>
      <div class="grid-selector">
        <button class="grid-opt">1/4</button>
        <button class="grid-opt is-active">1/16</button>
        <button class="grid-opt">1/32</button>
      </div>
    </div>
  </div>
</div>

<div class="floating-bar">
  <button class="mode-btn active" data-mode="dark"><i class="ph-duotone ph-moon"></i> Dark</button>
  <button class="mode-btn" data-mode="light"><i class="ph-duotone ph-sun"></i> Light</button>
</div>

<script>
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.documentElement.dataset.theme=btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Animate fake cursor
var cursor=document.getElementById('fakeCursor');
var positions=[{top:12,left:346},{top:28,left:364},{top:42,left:274},{top:14,left:244},{top:70,left:304}];
var i=0;
setInterval(function(){
  i=(i+1)%positions.length;
  cursor.style.top=positions[i].top+'px';
  cursor.style.left=positions[i].left+'px';
},2000);

document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
</script>
</body>
</html>
