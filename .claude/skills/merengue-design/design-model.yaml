name: "Merengue"
philosophy: "一间洒满暖光的创意音乐工作室。温暖的深色画布上，糖果色的音符跳跃在柔软的圆角面板之间。珊瑚粉的强调色如心跳般贯穿界面。字体圆润可亲，动效带着弹簧般的顽皮。这是一个让你想'玩'音乐的地方，而不仅仅是'编辑'MIDI。"
primary_mode: "dark"
brand_domain: "MIDI 编辑器 / 音乐创作工具"
brand_type: "ui-rich"
mono_for_code: true
mono_for_metrics: true

# ── PRIMITIVES ──
primitives:
  colors:
    neutral:
      50: "#FAF9F8"
      100: "#F5F2F0"
      200: "#E8E3DF"
      300: "#D4CDC7"
      400: "#A89D96"
      500: "#7A706A"
      600: "#5C5450"
      700: "#423B38"
      800: "#2E2927"
      900: "#242223"
      950: "#1A1819"
    brand:
      50: "#FFF0F2"
      100: "#FFE0E4"
      200: "#FFC2CA"
      300: "#FF8A98"
      400: "#FF6E82"
      500: "#FF5C72"
      600: "#E54D62"
      700: "#C03950"
      800: "#962A3D"
      900: "#6B1A2A"
      950: "#3D0D17"
    red:
      50: "#FEF2F2"
      500: "#E5484D"
      900: "#7F1D1D"
    green:
      50: "#F0FDF6"
      500: "#4BC0A0"
      900: "#134E3E"
    amber:
      50: "#FFFBF0"
      500: "#F4A742"
      900: "#78471A"
  spacing: [0, 1, 2, 4, 6, 8, 12, 16, 20, 24, 32, 40, 48, 64, 96]
  radii: [0, 4, 8, 12, 16, 24, 999]

# ── SEMANTIC TOKENS ──
tokens:
  colors:
    dark:
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      surface2: "{neutral.800}"
      surface3: "{neutral.700}"
      border: "{neutral.800}"
      border_visible: "{neutral.700}"
      text1: "{neutral.50}"
      text2: "{neutral.400}"
      text3: "{neutral.500}"
      text4: "{neutral.600}"
      accent: "{brand.400}"
      accent_subtle: "{brand.950}"
    light:
      background: "{neutral.50}"
      surface1: "{neutral.100}"
      surface2: "{neutral.200}"
      surface3: "{neutral.300}"
      border: "{neutral.200}"
      border_visible: "{neutral.300}"
      text1: "{neutral.900}"
      text2: "{neutral.600}"
      text3: "{neutral.500}"
      text4: "{neutral.400}"
      accent: "{brand.500}"
      accent_subtle: "{brand.50}"
    success: "{green.500}"
    warning: "{amber.500}"
    error: "{red.500}"

  spacing:
    "2xs": 2
    xs: 4
    sm: 8
    md: 16
    lg: 24
    xl: 32
    "2xl": 48
    "3xl": 64
    "4xl": 96

  radii:
    element: 4
    control: 8
    component: 12
    container: 16
    pill: 999

  typography:
    display:
      family: "Fredoka"
      size: "36px"
      weight: 500
      line_height: 1.15
    h1:
      family: "Fredoka"
      size: "28px"
      weight: 500
      line_height: 1.2
    h2:
      family: "Nunito Sans"
      size: "22px"
      weight: 600
      line_height: 1.25
    h3:
      family: "Nunito Sans"
      size: "18px"
      weight: 600
      line_height: 1.3
    body:
      family: "Nunito Sans"
      size: "14px"
      weight: 400
      line_height: 1.5
    body_sm:
      family: "Nunito Sans"
      size: "12px"
      weight: 400
      line_height: 1.5
    caption:
      family: "Nunito Sans"
      size: "11px"
      weight: 400
      line_height: 1.4
    label:
      family: "Nunito Sans"
      size: "10px"
      weight: 700
      line_height: 1.3
    mono:
      family: "JetBrains Mono"
      size: "12px"
      weight: 400

  elevation:
    strategy: "subtle"
    light:
      level1: "0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.06)"
      level2: "0 2px 8px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04)"
      level3: "0 4px 16px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.04)"
    dark:
      level1: "0 1px 2px rgba(0,0,0,0.20), 0 1px 4px rgba(0,0,0,0.30)"
      level2: "0 2px 8px rgba(0,0,0,0.30), 0 4px 16px rgba(0,0,0,0.20)"
      level3: "0 4px 16px rgba(0,0,0,0.40), 0 8px 32px rgba(0,0,0,0.30)"

  motion:
    personality: "playful"
    micro:
      duration: "150ms"
      easing: "cubic-bezier(0.34, 1.56, 0.64, 1)"
    standard:
      duration: "250ms"
      easing: "cubic-bezier(0.34, 1.3, 0.64, 1)"
    emphasis:
      duration: "400ms"
      easing: "cubic-bezier(0.32, 1.2, 0.64, 1)"

  hero_stage:
    preset: "painterly-no-hero"
    observed_style:
      description: "手绘水彩质感的暖色渐变背景，珊瑚粉、杏橙、淡紫交织，仿佛水彩在湿纸上自然晕染。无前景主体——背景本身就是艺术表达，传递音乐创作的温暖与自由。"
      where_used: ["hero"]
    background:
      medium: "painterly"
      color_mode: "palette"
      saturation: "vibrant"
      light_source: "center"
      falloff: "radial"
      vignette: "off"
      texture: "paint"
      motion: "drift"
      intensity: "subtle"
      safe_zone: "full-bleed"
      color_palette: ["#FF5C72", "#FFB347", "#C3A6F4", "#FF8A80", "#FFF0F2"]
    hero:
      subject: "none"
    relation:
      type: "flat"
      bleed: 0
    disclaimer: "通过 SVG feTurbulence + CSS 径向渐变近似手绘水彩质感。"

  iconography:
    observed_style:
      description: "温暖人文风格的双色调图标，圆润端点，友好可亲。适合创意工具和消费级产品。"
      stroke_weight: "regular (~1.5px)"
      corner_treatment: "soft"
      fill_style: "duotone"
      form_language: "humanist"
      visual_density: "balanced"
    fallback_kit:
      name: "Phosphor"
      weight: "duotone"
      match_score: "high"
      match_reasoning: "Phosphor duotone 的双色调设计和温暖人文风格完美匹配'可爱+艺术气息'的视觉方向。双色叠加让图标更有插画感和趣味性，比单色 outline 更富表现力。Iconoir 是第二选择，但缺乏 duotone 变体。"
      cdn: "https://unpkg.com/@phosphor-icons/web@2/src/duotone/style.css"
      icon_class_prefix: "ph-duotone ph-"
    disclaimer: "预览中的图标来自 Phosphor 图标库（MIT 许可），作为设计语言的最佳匹配。可替换为自定义图标集。"

# ── COMPONENTS ──
components:
  button_primary:
    source: "derived"
    background: "{brand.500}"
    color: "#FFFFFF"
    padding: "10px 20px"
    radius: "{radii.control}"
    font_weight: 600
    height: 36
    hover:
      background: "{brand.600}"
      transform: "scale(1.03)"
    active:
      background: "{brand.700}"
      transform: "scale(0.97)"
    disabled:
      opacity: 0.4
    focus:
      box_shadow: "0 0 0 3px {brand.200}"

  button_secondary:
    source: "derived"
    background: "transparent"
    color: "{neutral.50}"
    border: "1px solid {neutral.700}"
    padding: "10px 20px"
    radius: "{radii.control}"
    font_weight: 600
    height: 36
    hover:
      background: "{neutral.800}"
      border: "1px solid {neutral.600}"
    active:
      background: "{neutral.700}"
    disabled:
      opacity: 0.4

  button_ghost:
    source: "derived"
    background: "transparent"
    color: "{neutral.400}"
    padding: "8px 12px"
    radius: "{radii.control}"
    font_weight: 600
    height: 32
    hover:
      background: "{neutral.800}"
      color: "{neutral.50}"
    active:
      background: "{neutral.700}"

  button_destructive:
    source: "derived"
    background: "{red.500}"
    color: "#FFFFFF"
    padding: "10px 20px"
    radius: "{radii.control}"
    font_weight: 600
    height: 36
    hover:
      background: "#D32F2F"
    disabled:
      opacity: 0.4

  card:
    source: "derived"
    background: "{neutral.900}"
    border: "1px solid {neutral.800}"
    radius: "{radii.component}"
    padding: 20
    shadow: "0 1px 2px rgba(0,0,0,0.20), 0 1px 4px rgba(0,0,0,0.30)"

  input:
    source: "derived"
    height: 36
    background: "{neutral.800}"
    border_default: "1px solid {neutral.700}"
    border_focus: "1px solid {brand.500}"
    border_error: "1px solid {red.500}"
    radius: "{radii.control}"
    padding: "8px 12px"
    placeholder_color: "{neutral.500}"

  tag:
    source: "derived"
    height: 24
    padding: "2px 10px"
    radius: "{radii.pill}"
    background: "{neutral.800}"
    color: "{neutral.300}"
    font_weight: 600

  toggle:
    source: "derived"
    track_width: 40
    track_height: 22
    track_radius: 999
    thumb_size: 16
    thumb_radius: 999
    thumb_offset: 3
    off_bg: "{neutral.700}"
    on_bg: "{brand.500}"

  tooltip:
    source: "derived"
    background: "{neutral.800}"
    color: "{neutral.50}"
    radius: "{radii.element}"
    padding: "6px 12px"
    max_width: 240

  progress:
    source: "derived"
    height: 6
    radius: 999
    track_bg: "{neutral.800}"
    fill_color: "{brand.500}"

# ── APP SCREEN ──
app_screen:
  archetype: "editor"
  frame: "browser"
  frame_params:
    url: "merengue.app/projects/demo"
    title: "Merengue — demo.mid"
  content_seed: "MIDI piano roll editor with toolbar (pointer/pencil/eraser tools), vertical piano keyboard on the left, piano roll canvas with colorful note blocks, transport bar at bottom with play/pause/stop, track list sidebar on the right showing 3 tracks with different instrument colors"
  required_tokens_checklist:
    - "background, surface1, surface2, surface3, border, border_visible"
    - "text1, text2, text3, text4"
    - "accent, accent_subtle, success, warning, error"
    - "all typography scale tokens"
    - "all spacing tokens used in components"
